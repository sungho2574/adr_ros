ros_domain_id: 0

camera:
  sensor_id: 0
  sensor_mode: 3
  width: 1640
  height: 1232
  fps: 30.0
  output_width: 320
  output_height: 240
  interpolation_method: 1
  # Fixed 8.33 ms exposure and unity gain.
  exposure_time_range: "8330000 8330000"
  gain_range: "1 1"
  isp_digital_gain_range: "1 1"
  ae_lock: true

perception:
  engine_file: gatenet_240x320_fp16.plan
  onnx_file: gatenet_240x320.onnx
  remap_file: remap_320x240.npz
  gatenet_K_file: gatenet_K.yaml
  calib_file: calib_1640x1232_v2.yaml
  record: false

betaflight:
  port: /dev/ttyTHS1
  baud: 500000
  imu_hz: 100.0
  rc_hz: 25.0
  battery_hz: 2.0
  acc_lsb_per_g: 512.0   # Matches deploy. Confirm against the FC's stationary raw acceleration.
  response_timeout_s: 0.025
  frame_id: base_link

policy:
  imu_timeout_s: 0.05

viz:
  fps: 30.0
  output_width: 320
  jpeg_quality: 70
  stale_after: 2.0
  battery_source: ros   # ros: sensor_msgs/BatteryState; px4: px4_msgs/BatteryStatus
  battery_topic: ""    # Empty selects the topic for battery_source.
